<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .invoice-box {
            max-width: 800px;
            margin: auto;
        }

        .header {
            border-bottom: 2px solid #3498db;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header table {
            width: 100%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #3498db;
        }

        .invoice-info {
            text-align: right;
        }

        .details {
            width: 100%;
            margin-bottom: 40px;
        }

        .details td {
            padding: 10px;
            vertical-align: top;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            background: #3498db;
            color: white;
            padding: 10px;
            text-align: left;
        }

        .items-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Prueba de Factura</h1>
    <p>Hola, el objeto inscripcion ha llegado al PDF.</p>
</body>

</html>
