# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=gestion-talleres
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ------------------------------------------
# OPCIÓN A: H2 - BASE DE DATOS EN MEMORIA (DESACTIVADA)
# ------------------------------------------
# spring.datasource.url=jdbc:h2:mem:gestion_talleres;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ------------------------------------------
# OPCIÓN B: MYSQL - BASE DE DATOS LOCAL (ACTIVA)
# ------------------------------------------
# Asegúrate de que la base de datos 'gestion_talleres' esté creada en tu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_talleres?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JPA / HIBERNATE
# ==========================================
# 'update' sincroniza tus entidades con las tablas sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Esto ayuda a que MySQL no intente inicializarse con scripts de H2
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ==========================================
# SEGURIDAD Y ARCHIVOS
# ==========================================
jwt.secret=${JWT_SECRET:EstaEsMiClaveSecretaParaGestionDeTalleres2026}
jwt.expiration=86400000

# Tamaño máximo de fotos para los talleres (2MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=DEBUG