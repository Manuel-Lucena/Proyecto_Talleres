# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=gestion-talleres
server.port=8080

# ------------------------------------------
# OPCIÓN A: H2 - BASE DE DATOS EN MEMORIA (ACTIVA)
# Ideal para desarrollo rápido sin instalaciones. 
# Los datos se borran al cerrar la app.
# ------------------------------------------
spring.datasource.url=jdbc:h2:mem:gestion_talleres;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 para ver tablas en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ------------------------------------------
# OPCIÓN B: MYSQL - BASE DE DATOS PERSISTENTE (COMENTADA)
# Úsala cuando estés en tu PC con el servidor MySQL instalado.
# ------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/gestion_talleres?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# JPA / HIBERNATE (COMÚN PARA AMBAS)
# ==========================================
# 'update' mantiene tus tablas sincronizadas con tus clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# ==========================================
# SEGURIDAD, ARCHIVOS Y LOGS
# ==========================================
jwt.secret=${JWT_SECRET:EstaEsMiClaveSecretaParaGestionDeTalleres2026}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
