<div class="app-content-wrapper">
  <router-outlet></router-outlet>
</div>

<div class="accessibility-container">
  <button class="accessibility-btn" (click)="toggleAccessMenu()" type="button">
    <i class="bi" [ngClass]="showAccessMenu ? 'bi-x-lg' : 'bi-universal-access'"></i>
  </button>

  <div class="accessibility-panel" [class.show]="showAccessMenu">
    <div class="panel-header">
      <p class="panel-title">Accesibilidad</p>
    </div>
    
    <div class="panel-body">
      <div class="option-item d-flex justify-content-between align-items-center mb-3">
        <span>Modo Oscuro</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" (change)="toggleDarkMode($event)" [checked]="isDarkMode">
        </div>
      </div>

      <div class="option-item mb-3">
        <label class="d-block mb-1">Contraste ({{contrastValue}}%)</label>
        <input type="range" class="form-range" min="50" max="150" step="10" 
               (input)="updateContrast($event)" [value]="contrastValue">
      </div>

      <div class="option-item mb-3">
        <label class="d-block mb-1">Tipo de Daltonismo</label>
        <select class="form-select form-select-sm" (change)="setDaltonism($event)">
          <option value="none">Normal</option>
          <option value="protanopia">Protanopia (Rojo)</option>
          <option value="deuteranopia">Deuteranopia (Verde)</option>
          <option value="tritanopia">Tritanopia (Azul)</option>
        </select>
      </div>

      <div class="option-item mb-3">
        <label class="d-block mb-2">Tamaño de letra</label>
        <div class="btn-group w-100">
          <button (click)="changeFontSize('small')" class="btn btn-outline-secondary btn-sm">A</button>
          <button (click)="changeFontSize('medium')" class="btn btn-outline-secondary btn-sm">A+</button>
          <button (click)="changeFontSize('large')" class="btn btn-outline-secondary btn-sm">A++</button>
        </div>
      </div>

      <button class="reset-btn w-100" (click)="resetAll()">Restablecer todo</button>
    </div>
  </div>
</div>
