@if (config$ | async; as config) {
  <div class="modal-overlay" (click)="responder(false)">
    <div class="modal-body" (click)="$event.stopPropagation()">
      
      <div class="icono-pregunta">
        <i class="bi bi-question-circle-fill"></i>
      </div>

      <h3 class="modal-titulo">{{ config.titulo }}</h3>
      <p class="modal-texto">{{ config.mensaje }}</p>

      <div class="modal-acciones">
        <button type="button" class="btn-cancelar" (click)="responder(false)">
          {{ config.textoCancelar || 'CANCELAR' }}
        </button>
        <button type="button" class="btn-confirmar" (click)="responder(true)">
          {{ config.textoConfirmar || 'CONFIRMAR' }}
        </button>
      </div>

    </div>
  </div>
}
