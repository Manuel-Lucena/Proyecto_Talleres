<div class="modal-overlay">
  <div class="modal-content-custom">
    <header>
      <h2>Calificar Entrega</h2>
      <button (click)="cerrar.emit()" class="btn-close-modal">×</button>
    </header>

    <main *ngIf="entrega">
      <div class="info-entrega">
        <label>Texto del alumno:</label>
        <p class="texto-alumno">{{ entrega.textoEntrega || 'Sin comentarios' }}</p>
      </div>

      <div class="archivos-alumno" *ngIf="archivosAlumno.length > 0">
        <label>Archivos adjuntos:</label>
        <div class="lista-mini">
          <div *ngFor="let a of archivosAlumno" (click)="descargarArchivo(a)" class="chip-file">
            <i class="bi bi-download"></i> {{ a.nombre }}
          </div>
        </div>
      </div>

      <form [formGroup]="form" class="mt-4">
        <div class="mb-3">
          <label class="form-label">Nota (0 - 10)</label>
          <input type="number" formControlName="calificacion" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Feedback / Comentario</label>
          <textarea formControlName="comentarioProfesor" class="form-control" rows="4"></textarea>
        </div>
      </form>
    </main>

    <footer>
      <button (click)="cerrar.emit()" class="btn-secondary">Cancelar</button>
      <button (click)="guardarNota()" [disabled]="form.invalid || cargando" class="btn-primary">
        {{ cargando ? 'Guardando...' : 'Confirmar Nota' }}
      </button>
    </footer>
  </div>
</div>
