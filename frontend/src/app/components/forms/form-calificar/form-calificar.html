<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-content-custom" (click)="$event.stopPropagation()">
    <header>
      <h2>Calificar Entrega</h2>
      <button (click)="cerrar.emit()" class="btn-close-modal">×</button>
    </header>

    <main *ngIf="entrega">
      <div class="info-entrega">
        <label>Texto del alumno:</label>
        <p class="texto-alumno">{{ entrega.textoEntrega || 'Sin comentarios' }}</p>
      </div>

      <div class="archivos-alumno" *ngIf="archivosAlumno.length > 0">
        <label>Archivos adjuntos:</label>
        <div class="lista-archivos-enteros">
          <div *ngFor="let a of archivosAlumno" (click)="descargarArchivo(a)" class="item-archivo-completo">
            <i class="bi bi-file-earmark-arrow-down"></i>
            <div class="info">
              <span class="nombre">{{ a.nombre }}</span>
              <span class="sub">Click para descargar</span>
            </div>
          </div>
        </div>
      </div>

      <form [formGroup]="form" (submit)="$event.preventDefault()" class="mt-4">
        <div class="fila-formulario">
          <div class="campo-formulario">
            <label>Nota (0 - 10)</label>
            <input type="number" formControlName="calificacion" class="input-personalizado"
              [class.is-invalid]="errorService.mostrarError(form, 'calificacion')">
            
            <div class="error-container">
              @if (errorService.mostrarError(form, 'calificacion')) { 
                <span class="error-message">{{ errorService.getErrorMessage(form, 'calificacion') }}</span> 
              }
            </div>
          </div>
        </div>

        <div class="fila-formulario">
          <div class="campo-formulario">
            <label>Feedback / Comentario</label>
            <textarea formControlName="comentarioProfesor" class="input-personalizado" rows="3"></textarea>
            <div class="error-container"></div>
          </div>
        </div>
      </form>
    </main>

    <footer>
      <button (click)="cerrar.emit()" class="btn-secondary">Cancelar</button>
      <button (click)="guardarNota()" [disabled]="form.invalid || cargando" class="btn-primary">
        {{ cargando ? 'Guardando...' : 'Confirmar Nota' }}
      </button>
    </footer>
  </div>
</div>
