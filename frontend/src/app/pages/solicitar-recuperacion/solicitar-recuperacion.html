<div class="contenedor-login">
  <div class="card tarjeta-login shadow-lg border-0 overflow-hidden">
    <div class="row g-0">
      
      <div class="col-md-6 bg-white d-flex align-items-center">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <h1 class="h2 mt-2 fw-bold">Recuperar Acceso</h1>
            <p class="text-muted small">Te enviaremos un enlace a tu correo</p>
          </div>

          <div *ngIf="enviado" class="alert alert-success border-0 shadow-sm mb-4">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span class="small fw-bold">¡Correo enviado! Revisa tu bandeja de entrada.</span>
          </div>

          <div *ngIf="mensajeError" class="alert alert-danger border-0 shadow-sm mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span class="small fw-bold">{{ mensajeError }}</span>
          </div>

          <form *ngIf="!enviado" [formGroup]="recoveryForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label class="form-label fw-bold small text-secondary">CORREO ELECTRÓNICO</label>
              <div class="input-group custom-focus" 
                   [class.is-invalid]="recoveryForm.get('email')?.touched && recoveryForm.get('email')?.invalid">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" formControlName="email" class="form-control shadow-none" 
                       placeholder="nombre@ejemplo.com">
              </div>
              <div class="text-danger small mt-1" *ngIf="recoveryForm.get('email')?.touched && recoveryForm.get('email')?.invalid">
                El correo es obligatorio y debe ser válido.
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm" [disabled]="loading">
              <span *ngIf="!loading">ENVIAR ENLACE <i class="bi bi-send ms-2"></i></span>
              <span *ngIf="loading">ENVIANDO...</span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <a [routerLink]="['/login']" class="enlace-olvido small text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
            </a>
          </div>
        </div>
      </div>

      <div class="col-md-6 d-none d-md-flex seccion-derecha-imagen align-items-center justify-content-center">
        <img src="icons/Logo.png" alt="Logo" class="logo-sobre-imagen">
      </div>

    </div>
  </div>
</div>
