<div class="profile-layout">
  <aside class="sidebar">
    <div class="user-info">
      <div class="avatar">
        <img src="icons/Logo.png" alt="User">
        <label for="f-up"><i class="bi bi-camera"></i></label>
        <input type="file" id="f-up" hidden>
      </div>
      <h5>Admin Aula Viva</h5>
      <span>Administrador</span>
    </div>
    
    <nav class="menu">
      <a class="item active"><i class="bi bi-person"></i> Perfil</a>
      <a class="item"><i class="bi bi-shield"></i> Seguridad</a>
      <a class="item"><i class="bi bi-bell"></i> Avisos</a>
      <div class="spacer"></div>
      <a class="item out"><i class="bi bi-box-arrow-left"></i> Salir</a>
    </nav>
  </aside>

  <main class="content">
    <div class="main-card">
      <h4 class="fw-bold mb-4">Información de cuenta</h4>
      <div class="grid-fields">
        <div class="f-box">
          <label>Nombre Completo</label>
          <input type="text" value="Admin Aula Viva">
        </div>

        <div class="f-box readonly">
          <label>Correo Electrónico</label>
          <input type="text" value="admin@aulaviva.com" readonly>
        </div>

        <div class="f-box readonly">
          <label>DNI / NIE</label>
          <input type="text" value="12345678A" readonly>
        </div>

        <div class="f-box">
          <label>Teléfono de contacto</label>
          <input type="text" value="+34 600 000 000">
        </div>

        <div class="f-box">
          <label>Dirección</label>
          <input type="text" value="Calle Ejemplo, 12, Jaén">
        </div>
      </div>

      <div class="text-end mt-4">
        <button class="btn-av">Guardar Cambios</button>
      </div>
    </div>
  </main>
</div>
