apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-taller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-taller
  template:
    metadata:
      labels:
        app: frontend-taller
    spec:
      containers:
      - name: frontend
        image: gestion-talleres-front:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # --- AÑADIR ESTO PARA ESCALABILIDAD ---
        resources:
          requests:
            cpu: "100m"      # Reserva mínima
            memory: "128Mi"
          limits:
            cpu: "300m"      # Límite máximo
            memory: "256Mi"
        # --------------------------------------
        volumeMounts:
        - name: disco-compartido
          mountPath: "/usr/share/nginx/html/noticias"
          subPath: "public/noticias"
        - name: disco-compartido
          mountPath: "/usr/share/nginx/html/usuarios"
          subPath: "public/Usuarios"
        - name: disco-compartido
          mountPath: "/usr/share/nginx/html/talleres"
          subPath: "public/talleres"
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: disco-compartido
        persistentVolumeClaim:
          claimName: taller-storage-pvc
      - name: config-volume
        configMap:
          name: nginx-config